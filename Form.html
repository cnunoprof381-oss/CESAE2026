<!DOCTYPE html>
<html>
    <head>
        <title>Formulário de Contacto</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <div id="Formulario">
          
            <form>
                <fieldset style="width: 500px;">
                <legend><strong>Formulário de Contacto</strong></legend> 
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome"><br><br>
                <label for="email">Email:</label>
                <input type="text" id="email" name="email"><br>
                <p>Género:</p>
                <input type="radio" id="masculino" name="genero" value="masculino">
                <label for="masculino">Masculino</label><br>
                <input type="radio" id="feminino" name="genero" value="feminino">
                <label for="feminino">Feminino</label><br><br>
                <label for="nascimento">Data Atual:</label>
                <input type="date" id="nascimento" name="nascimento"><br><br>
                 <label for="turma">Turma: </label>
                <select name="turma" id="turma">
                    <option value="1">Web Developer & Mobile</option>
                    <option value="2">Outra</option>    
                </select><br><br>
                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="3" cols="40"></textarea><br><br>
                <input type="submit" value="Enviar">    
                <input type="reset" value="Limpar">    
                </fieldset>
            </form>
        
        </div>
    </body>
</html>
